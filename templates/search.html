<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vector Search - News Documents</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card-bg: #ffffff;
      --border: #e4e7ee;
      --text: #1f2430;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --radius: 10px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      max-width: 800px;
      margin: 48px auto;
      padding: 0 20px;
      color: var(--text);
      background: var(--bg);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin-top: 4px;
      line-height: 1.5;
    }

    nav {
      margin-bottom: 24px;
      font-size: 13px;
    }
    nav a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    nav a:hover { text-decoration: underline; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-top: 24px;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.04);
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
    }
    label:first-child { margin-top: 0; }

    input[type="text"], select {
      width: 100%;
      padding: 10px 12px;
      margin-top: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.15s ease;
    }
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .row {
      display: flex;
      gap: 12px;
    }
    .row > div { flex: 1; }

    button {
      margin-top: 18px;
      padding: 10px 18px;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    button:hover { background: var(--accent-hover); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    #status {
      margin-top: 12px;
      font-size: 13px;
      color: var(--muted);
    }
    #status:empty { display: none; }

    .results-header {
      margin-top: 24px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .result-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-top: 12px;
      box-shadow: 0 1px 3px rgba(16, 24, 40, 0.04);
    }

    .result-item .title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .result-item .title a {
      color: var(--accent);
      text-decoration: none;
    }
    .result-item .title a:hover { text-decoration: underline; }

    .result-item .meta {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .result-item .meta span {
      margin-right: 12px;
    }

    .result-item .chunk-text {
      font-size: 13px;
      line-height: 1.6;
      color: var(--text);
      background: #f9fafb;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .similarity-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      background: #ecfdf5;
      color: #065f46;
    }
  </style>
</head>
<body>
  <nav><a href="/">&larr; Back to Watchlist</a></nav>
  <h1>Vector Search</h1>
  <p class="hint">Enter a natural language prompt to find the most relevant news documents and chunks using semantic similarity over embeddings stored in Lakebase.</p>

  <div class="card">
    <form id="search-form">
      <label for="query">Search prompt</label>
      <input type="text" id="query" name="q" placeholder="e.g. AI spending and cloud revenue growth" required>

      <div class="row">
        <div>
          <label for="mode">Search mode</label>
          <select id="mode" name="mode">
            <option value="chunks">Chunks (passages)</option>
            <option value="articles">Articles (whole documents)</option>
          </select>
        </div>
        <div>
          <label for="ticker">Ticker filter (optional)</label>
          <input type="text" id="ticker" name="ticker" placeholder="AAPL">
        </div>
        <div>
          <label for="limit">Max results</label>
          <select id="limit" name="limit">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
          </select>
        </div>
      </div>

      <button type="submit" id="search-btn">Search</button>
    </form>
    <div id="status"></div>
  </div>

  <div id="results-container"></div>

  <script>
    const form = document.getElementById("search-form");
    const statusEl = document.getElementById("status");
    const resultsContainer = document.getElementById("results-container");
    const searchBtn = document.getElementById("search-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = document.getElementById("query").value.trim();
      const mode = document.getElementById("mode").value;
      const ticker = document.getElementById("ticker").value.trim();
      const limit = document.getElementById("limit").value;

      if (!query) return;

      searchBtn.disabled = true;
      statusEl.textContent = "Searching...";
      resultsContainer.innerHTML = "";

      const params = new URLSearchParams({ q: query, mode, limit });
      if (ticker) params.set("ticker", ticker.toUpperCase());

      try {
        const resp = await fetch(`/search?${params}`);
        const data = await resp.json();

        if (!resp.ok) {
          statusEl.textContent = "Error: " + (data.error || resp.statusText);
          searchBtn.disabled = false;
          return;
        }

        statusEl.textContent = `Found ${data.count} result(s) for "${data.query}" (mode: ${data.mode})`;

        if (data.count === 0) {
          resultsContainer.innerHTML = '<div class="card"><p style="color:var(--muted);text-align:center">No matching documents found. Try a different prompt or remove the ticker filter.</p></div>';
          searchBtn.disabled = false;
          return;
        }

        data.results.forEach((item, i) => {
          const div = document.createElement("div");
          div.className = "result-item";

          if (mode === "chunks") {
            div.innerHTML = `
              <div class="title">${item.title ? `<a href="${item.article_url || '#'}" target="_blank">${escapeHtml(item.title)}</a>` : 'Untitled'}</div>
              <div class="meta">
                <span><strong>Ticker:</strong> ${item.ticker || '-'}</span>
                <span><strong>Chunk:</strong> #${item.chunk_index}</span>
                <span><strong>Published:</strong> ${item.published_utc ? new Date(item.published_utc).toLocaleDateString() : '-'}</span>
                <span class="similarity-badge">${item.similarity} similarity</span>
              </div>
              <div class="chunk-text">${escapeHtml(item.chunk_text || '')}</div>
            `;
          } else {
            div.innerHTML = `
              <div class="title">${item.title ? `<a href="${item.article_url || '#'}" target="_blank">${escapeHtml(item.title)}</a>` : 'Untitled'}</div>
              <div class="meta">
                <span><strong>Ticker:</strong> ${item.ticker || '-'}</span>
                <span><strong>Publisher:</strong> ${item.publisher_name || '-'}</span>
                <span><strong>Sentiment:</strong> ${item.sentiment || '-'}</span>
                <span><strong>Published:</strong> ${item.published_utc ? new Date(item.published_utc).toLocaleDateString() : '-'}</span>
                <span class="similarity-badge">${item.similarity} similarity</span>
              </div>
            `;
          }
          resultsContainer.appendChild(div);
        });

      } catch (err) {
        statusEl.textContent = "Request failed: " + err;
      }
      searchBtn.disabled = false;
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
